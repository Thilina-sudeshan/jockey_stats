<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Login</title>
<style>
body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; color: #0f172a; }
.card { max-width: 420px; margin: 80px auto; background: white; border-radius: 18px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
h1 { margin-top: 0; }
label { display: block; margin: 14px 0 8px; font-weight: 600; }
input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; box-sizing: border-box; }
button { margin-top: 18px; width: 100%; background: #0f172a; color: white; border: none; padding: 12px 22px; border-radius: 12px; cursor: pointer; }
.error { margin-top: 12px; color: #b91c1c; }
.hint { margin-top: 12px; color: #475569; font-size: 14px; }
</style></head>
<body><div class="card"><h1>Login</h1>
<form method="post" action="/login">
<label>Username</label><input name="username" type="text" autocomplete="username" required>
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="hint">Use username <strong>admin</strong> and password <strong>admin123</strong>.</div>
</div></body></html>
